name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build styles
        run: |
          npm ci
          npm run build:css

      - name: Verify lint, unit tests, and offline routes
        run: |
          npm run lint
          npm test
          node tools/coverage-badge.js
          node tests/test_routes.mjs

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html services.html locations.html faqs.html _site/
          cp -R assets _site/assets
          mkdir -p _site/badges
          cp badges/coverage.json badges/coverage.svg _site/badges/
          cp robots.txt _site/robots.txt
          # Copy .nojekyll so Jekyll does not ignore files
          touch _site/.nojekyll

      - name: Publish the production site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview/
          force: false
          commit-message: Publish production site
